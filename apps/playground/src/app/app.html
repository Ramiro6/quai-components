<form [formGroup]="form" (ngSubmit)="handleSubmit()" autocomplete="off">
  <quai-boundary-error-legacy controlName="email">
    <input formControlName="email" type="email" autocomplete="off" />
  </quai-boundary-error-legacy>

  <quai-boundary-error-legacy controlName="password">
    <input formControlName="password" type="password" autocomplete="new-password" />
  </quai-boundary-error-legacy>

  <quai-boundary-error-legacy controlName="repeatPassword" showGroupError="passwordMismatch">
    <input formControlName="repeatPassword" type="password" autocomplete="new-password" />
  </quai-boundary-error-legacy>
  <button>Submit</button>
</form>
<router-outlet></router-outlet>
